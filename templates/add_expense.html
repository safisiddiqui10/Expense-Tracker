{% extends "base.html" %}

{% block title %}Add Expense — Budgetly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Add Expense</h1>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        class="form-input"
                        step="0.01"
                        min="0.01"
                        value="{{ form.amount }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not form.category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        class="form-input"
                        value="{{ form.date }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="label-optional">(optional)</span></label>
                    <input
                        type="text"
                        id="description"
                        name="description"
                        class="form-input"
                        maxlength="200"
                        value="{{ form.description }}"
                        placeholder="e.g. Lunch at cafe"
                    >
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
