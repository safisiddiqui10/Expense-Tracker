{% extends "base.html" %}

{% block title %}Add Expense — Budgetly{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-page-inner">

    <div class="form-page-header">
      <a href="{{ url_for('profile') }}" class="back-link">← Dashboard</a>
      <h1 class="profile-title" style="font-family: var(--font-display); font-size: 1.75rem; color: var(--ink);">Add Expense</h1>
    </div>

    {% if error %}
    <div class="auth-error" style="margin-bottom: 1rem;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_expense') }}">
      <div class="form-card">

        <div class="form-card-header">
          <p class="form-card-title">New transaction</p>
          <p class="form-card-subtitle">Fill in the details below to log your expense.</p>
        </div>

        <div class="form-card-body">

          <div class="form-grid-2">
            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input
                type="number"
                id="amount"
                name="amount"
                class="form-input"
                step="0.01"
                min="0.01"
                value="{{ form.amount }}"
                placeholder="0.00"
                required
              >
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input
                type="date"
                id="date"
                name="date"
                class="form-input"
                value="{{ form.date }}"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-input" required>
              <option value="" disabled {% if not form.category %}selected{% endif %}>Select a category</option>
              {% for cat in categories %}
              <option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="description">Description <span class="label-optional">(optional)</span></label>
            <input
              type="text"
              id="description"
              name="description"
              class="form-input"
              maxlength="200"
              value="{{ form.description }}"
              placeholder="e.g. Lunch at cafe"
            >
          </div>

        </div>

        <div class="form-card-footer">
          <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
          <button type="submit" class="btn-accent">Save Expense</button>
        </div>

      </div>
    </form>

  </div>
</div>
{% endblock %}
